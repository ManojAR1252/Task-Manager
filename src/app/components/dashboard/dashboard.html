<div class="dashboard-content">

  <div class="list-section">
    <h2>Tasks</h2>

    <app-task-list
      (editTask)="editTask($event)">
    </app-task-list>
  </div>

  <div class="form-section">
    <app-task-form
      [taskToEdit]="selectedTask"
      (formSubmitted)="clearSelection()">
    </app-task-form>
  </div>

</div>
