<div class="login-container">

  <div class="login-card">

    <h2>Task Manager Login</h2>

    <input
      type="text"
      [(ngModel)]="username"
      placeholder="Username">

    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Password">

    <button (click)="login()">
      Login
    </button>

    <p>
      Demo Login:
      manoj / 123
    </p>

  </div>

</div>
